version: 2

project_name: cloudtorrent

before:
  hooks:
    - go mod tidy

builds:
  - id: cloudtorrent
    main: .
    binary: cloudtorrent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: cloudtorrent-archive
    ids:
      - cloudtorrent
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - static/*
      - static/**/*
      - assets/*
      - assets/**/*
      - README.md
      - Procfile
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: wojkann
    name: CloudTorrent
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"
